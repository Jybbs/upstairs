min_version = "2026.11.4"

[env]
CARGO_TARGET_DIR   = "{{config_root}}/.cache/cargo"
NODE_COMPILE_CACHE = "{{config_root}}/.cache/node"

[settings]
auto_install = false

[tool_config]
locked = true

[tools]
bun                                = "1.4.4"
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
lychee                             = "0.24.2"
osv-scanner                        = "2.7.1"
rust                               = { components = "clippy,rustfmt", profile = "minimal", targets = "wasm32-unknown-unknown", version = "1.99.1" }
zizmor                             = "1.32.0"
