[tools]
bun = "1.4.4"

[tasks.dev]
description = "Serve the site locally"
run = "bun run --bun vite"

[tasks.build]
description = "Type-check and build the site"
run = ["bun run --bun vue-tsc --noEmit", "bun run --bun vite build"]

[tasks.test]
description = "Run the tests"
run = "bun run --bun vitest run"

[tasks.catalog]
description = "Fetch the satellite catalog into public/"
run = "bun run tools/catalog.ts"
