name        : Provision
description : Install mise at the floor `.mise/config.toml` sets and the tools a job names, at the versions `.mise/mise.lock` pins

inputs:
  cache:
    default     : 'true'
    description : Whether to restore the tool cache at all

  save:
    default     : 'false'
    description : Whether to save the tool cache once the tools are installed

  tools:
    description : The tools to install, separated by spaces
    required    : true

runs:
  using: composite
  steps:
    - name  : Read the mise floor, the cache label, and the mise folder
      env   : { TOOLS: "${{ inputs.tools }}" }
      id    : floor
      shell : bash
      run: |
        echo "version=$(sed -n 's/^min_version = "\(.*\)"$/\1/p' .mise/config.toml)" >> "$GITHUB_OUTPUT"
        echo "label=${TOOLS// /+}" >> "$GITHUB_OUTPUT"
        echo "data=${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}" >> "$GITHUB_OUTPUT"

    - name : Install the tools
      env  : { MISE_CARGO_HOME: "${{ steps.floor.outputs.data }}/cargo", MISE_RUSTUP_HOME: "${{ steps.floor.outputs.data }}/rustup" }
      uses : jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
      with : { cache: "${{ inputs.cache }}", cache_key: "provision-${{ steps.floor.outputs.label }}-{{default}}", cache_key_prefix: mise-v2, cache_max_age_days: '0', cache_save: "${{ inputs.save }}", install_args: "${{ inputs.tools }}", version: "${{ steps.floor.outputs.version }}" }
