name        : 🛰️ Draft
run-name    : 🛰️ Draft · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

on:
  push:
    branches : [main]
    paths    : [docs/package.json]

  workflow_dispatch:

concurrency:
  cancel-in-progress : false
  group              : ${{ github.workflow }}-${{ github.ref }}

jobs:
  cut:
    name            : 🏷️ Cut
    if              : github.ref == 'refs/heads/main'
    permissions     : { contents: write }
    runs-on         : &runner ubuntu-26.04
    timeout-minutes : &timeout 15

    steps:
      - name : Check out
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with : { fetch-depth: 0, persist-credentials: false }

      - name : Provision
        uses : $/.github/actions/provision
        with : { cache: 'false', tools: &bun bun }

      - name : Draft the release where no release carries the version
        env  : { BEFORE: "${{ github.event.before }}", GH_TOKEN: "${{ github.token }}" }
        run  : mise run gha:cut

  logbook:
    name            : 📓 Logbook
    if              : always()
    needs           : [cut]
    permissions     : { actions: read }
    runs-on         : *runner
    timeout-minutes : *timeout

    steps:
      - name : Check out
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with : { persist-credentials: false }

      - name : Provision
        uses : $/.github/actions/provision
        with : { tools: *bun }

      - name : Write the summary
        env  : { GH_TOKEN: "${{ github.token }}", NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:logbook
