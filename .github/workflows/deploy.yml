concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  catalog:
    if: github.ref == 'refs/heads/main'
    name: 📡 Catalog Service
    needs: [press]
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision
        uses: $/.github/actions/provision
        with:
          cache: 'false'
          tools: bun
      - name: Install the packages
        run: mise run site:install
      - name: Deploy the catalog service
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: mise x -- bun x --no-install wrangler deploy --config .vitepress/catalog/wrangler.json
        working-directory: docs
    timeout-minutes: 10
  logbook:
    if: always()
    name: 📓 Logbook
    needs: [catalog, press, site]
    permissions:
      actions: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision
        uses: $/.github/actions/provision
        with:
          tools: bun
      - name: Write the summary
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: mise run gha:logbook
    timeout-minutes: 10
  press:
    name: 📰 Press
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision
        uses: $/.github/actions/provision
        with:
          tools: bun github:EmbarkStudios/cargo-about lychee rust github:wasm-bindgen/wasm-bindgen
      - name: Press the site and check its links
        run: mise run site:links
      - name: Attach the pressed site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: site
          path: docs/.vitepress/dist
          retention-days: 1
    timeout-minutes: 15
  site:
    if: github.ref == 'refs/heads/main'
    name: 🌐 Site
    needs: [press]
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision
        uses: $/.github/actions/provision
        with:
          cache: 'false'
          tools: bun
      - name: Install the packages
        run: mise run site:install
      - name: Download the pressed site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: site
          path: docs/.vitepress/dist
      - name: Deploy the site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: mise x -- bun x --no-install wrangler pages deploy .vitepress/dist --branch=main --project-name=upstairs
        working-directory: docs
    timeout-minutes: 10
name: 🛰️ Deploy
on:
  push:
    branches: [main]
    paths:
      - .github/actions/provision/**
      - .github/workflows/deploy.yml
      - .mise/**
      - docs/**
      - rust/**
      - '!docs/.vitepress/tests/**'
  workflow_dispatch:
permissions:
  contents: read
