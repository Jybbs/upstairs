name        : 🛰️ Deploy
run-name    : 🛰️ Deploy · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

env:
  REF : ${{ github.head_ref || github.ref_name }}
  SHA : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths: &sources
      - .github/actions/provision/**
      - .github/scripts/summaries/deploy.md
      - .github/workflows/deploy.yml
      - .mise/**
      - docs/**
      - rust/**

  push:
    branches : [main]
    paths    : *sources

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.ref }}

jobs:
  press:
    name            : 📰 Press
    runs-on         : &runner ubuntu-26.04
    timeout-minutes : &timeout 15

    steps:
      - &checkout
        name : Check out
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with : { persist-credentials: false }

      - name : Provision
        uses : $/.github/actions/provision
        with : { tools: bun github:EmbarkStudios/cargo-about lychee rust github:wasm-bindgen/wasm-bindgen }

      - name : Press the site and check its links
        run  : mise run site:links

      - name : Run the suite under coverage
        if   : &pushed github.event_name != 'pull_request'
        run  : mise run site:coverage

      - name : Write the coverage figure the badge reads
        if   : *pushed
        run  : mise run gha:total -- docs/.vitepress/dist

      - name : Attach the pressed site
        uses : actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with : { if-no-files-found: error, name: site, path: docs/.vitepress/dist, retention-days: 1 }

  site:
    name            : 🌐 Site
    needs           : &pressed [press]
    outputs         : { url: "${{ steps.deploy.outputs.url }}" }
    runs-on         : *runner
    timeout-minutes : *timeout
    if: >-
      github.ref == 'refs/heads/main'
      || (github.event_name == 'pull_request' && github.head_ref != 'main'
      && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - *checkout

      - &provision
        name : Provision
        uses : $/.github/actions/provision
        with : { cache: 'false', tools: &bun bun }

      - name : Download the pressed site
        uses : actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with : { name: site, path: docs/.vitepress/dist }

      - name : Deploy the site
        env  : { CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_TOKEN }}" }
        id   : deploy
        run  : mise run gha:site

  catalog:
    name            : 📡 Catalog
    if              : github.ref == 'refs/heads/main'
    needs           : *pressed
    runs-on         : *runner
    timeout-minutes : *timeout

    steps:
      - *checkout

      - *provision

      - name : Deploy the catalog service
        env  : { CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_TOKEN }}" }
        run  : mise run gha:catalog

      - name : Delete the secrets the service no longer reads
        env  : { CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_TOKEN }}" }
        run  : mise run gha:unbind

      - name : Check the served catalog
        run  : mise run gha:served

  logbook:
    name            : 📓 Logbook
    if              : always()
    needs           : [catalog, press, site]
    permissions     : { actions: read }
    runs-on         : *runner
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision
        uses : $/.github/actions/provision
        with : { tools: *bun }

      - name : Write the summary
        env  : { GH_TOKEN: "${{ github.token }}", NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:logbook
