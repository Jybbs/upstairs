concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_VERSION: 4.160.0
jobs:
  brief:
    if: always()
    name: 🔭 Brief
    needs: [catalog, press, site]
    permissions:
      actions: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision
        uses: $/.github/actions/provision
        with:
          tools: bun
      - name: Write the summary
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: mise run gha:brief
    timeout-minutes: 10
  catalog:
    if: github.ref == 'refs/heads/main'
    name: 📡 Catalog Service
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Deploy the catalog service
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          command: deploy --config docs/.vitepress/catalog/wrangler.json
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
    timeout-minutes: 10
  press:
    name: 📰 Press
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision
        uses: $/.github/actions/provision
        with:
          tools: bun github:EmbarkStudios/cargo-about lychee rust github:wasm-bindgen/wasm-bindgen
      - name: Press the site and check its links
        run: mise run site:links
      - name: Attach the pressed site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: site
          path: docs/.vitepress/dist
          retention-days: 1
    timeout-minutes: 15
  site:
    if: github.ref == 'refs/heads/main'
    name: 🌐 Site
    needs: [press]
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - name: Download the pressed site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: site
          path: site
      - name: Deploy the site
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          command: pages deploy site --branch=main --project-name=upstairs
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
    timeout-minutes: 10
name: 🛰️ Deploy
on:
  push:
    branches: [main]
    paths:
      - .github/actions/provision/**
      - .github/workflows/deploy.yml
      - .mise/**
      - docs/**
      - rust/**
      - '!docs/.vitepress/tests/**'
  workflow_dispatch:
permissions:
  contents: read
