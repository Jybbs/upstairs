concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  REF: ${{ github.head_ref || github.ref_name }}
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  WRANGLER_SEND_METRICS: 'false'
jobs:
  catalog:
    if: github.ref == 'refs/heads/main'
    name: 📡 Catalog
    needs: [press]
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision
        uses: $/.github/actions/provision
        with:
          cache: 'false'
          tools: bun
      - name: Install the packages
        run: mise run site:install
      - name: Deploy the catalog service
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: mise x -- bun x --no-install wrangler deploy --config .vitepress/catalog/wrangler.json
        working-directory: docs
      - name: Delete the secrets the service no longer reads
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: mise run gha:unbind
      - name: Check the served catalog
        run: mise run gha:served
    timeout-minutes: 10
  logbook:
    if: always()
    name: 📓 Logbook
    needs: [catalog, press, site]
    permissions:
      actions: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision
        uses: $/.github/actions/provision
        with:
          tools: bun
      - name: Write the summary
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: mise run gha:logbook
    timeout-minutes: 10
  press:
    name: 📰 Press
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision
        uses: $/.github/actions/provision
        with:
          tools: bun github:EmbarkStudios/cargo-about lychee rust github:wasm-bindgen/wasm-bindgen
      - name: Press the site and check its links
        run: mise run site:links
      - name: Run the suite under coverage
        if: github.event_name != 'pull_request'
        run: mise run site:coverage
      - name: Write the coverage figure the badge reads
        if: github.event_name != 'pull_request'
        run: mise run gha:total -- docs/.vitepress/dist
      - name: Attach the pressed site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: site
          path: docs/.vitepress/dist
          retention-days: 1
    timeout-minutes: 15
  site:
    if: >-
      github.ref == 'refs/heads/main'
      || (github.event_name == 'pull_request' && github.head_ref != 'main'
      && github.event.pull_request.head.repo.full_name == github.repository)
    name: 🌐 Site
    needs: [press]
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision
        uses: $/.github/actions/provision
        with:
          cache: 'false'
          tools: bun
      - name: Install the packages
        run: mise run site:install
      - name: Download the pressed site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: site
          path: docs/.vitepress/dist
      - name: Deploy the site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          FUNCTIONS: ${{ github.ref == 'refs/heads/main' && '.' || '.vitepress/preview' }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        id: deploy
        working-directory: docs
        run: |
          mise x -- bun x --no-install wrangler pages deploy "$PWD/.vitepress/dist" --branch="$REF" --cwd="$FUNCTIONS" --project-name=upstairs
          jq -r 'select(.type == "pages-deploy-detailed") | "url=\(.url)"' "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
    timeout-minutes: 10
name: 🛰️ Deploy
on:
  pull_request:
    paths: &sources
      - .github/actions/provision/**
      - .github/scripts/summaries/deploy.md
      - .github/workflows/deploy.yml
      - .mise/**
      - docs/**
      - rust/**
  push:
    branches: [main]
    paths: *sources
  workflow_dispatch:
permissions:
  contents: read
