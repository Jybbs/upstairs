body:
  - attributes:
      description: What the site or the task does, naming the spot, the time, the browser, and the screen width for the site, or the output for a task.
      label: Behavior
    id: happens
    type: textarea
    validations:
      required: true
  - attributes:
      description: What it does instead, with the source a reader can check it against where one exists.
      label: Expected Behavior
    id: expected
    type: textarea
    validations:
      required: true
  - attributes:
      description: The steps that reach the defect, starting from the address the site opens on or from the command that runs the task.
      label: Steps
      value: |
        1.
    id: steps
    type: textarea
    validations:
      required: true
description: Report a defect in the site or in a task
labels: ["🐞 bug"]
name: Bug
