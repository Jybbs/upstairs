body:
  - attributes:
      description: Two or three sentences naming what is missing or wrong today and what the change gives a reader.
      label: Lead
    id: lead
    type: textarea
    validations:
      required: true
  - attributes:
      description: A numbered list of what the change must do, each item one sentence a reviewer can check against the diff.
      label: Requirements
      value: |
        1.
    id: requirements
    type: textarea
    validations:
      required: true
description: Propose a change, stated as what it must do rather than how
name: Spec
