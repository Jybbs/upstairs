[advisories]
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "sgp4 2.4.0 requires chrono ^0.4.43 with no feature to drop it" },
]
unmaintained = "all"
yanked       = "deny"

[bans]
multiple-versions = "deny"
wildcards         = "deny"

[licenses]
allow   = ["MIT", "Apache-2.0", "Unicode-3.0"]
private = { ignore = true }

[sources]
unknown-git      = "deny"
unknown-registry = "deny"
