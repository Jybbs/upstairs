[package]
name    = "orbit"
edition = "2024"
publish = false
version = "0.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sgp4         = "=2.4.0"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
serde      = { features = ["derive"], version = "=1.0.229" }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto           = true
